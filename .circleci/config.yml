version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v3-dependencies-{{ checksum "package-lock.json" }}
            # fallback to using the latest cache if no exact match is found
            - v3-dependencies-
      - run:
          name: Download Dependencies
          command: npm ci
      - save_cache:
          paths:
            - node_modules
          key: v3-dependencies-{{ checksum "package-lock.json" }}
      - run:
          name: Verify (Standard)
          command: npm run fast-tests
      - store_test_results:
          path: test-results
